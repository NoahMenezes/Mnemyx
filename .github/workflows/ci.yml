# ---------------------------------------------------------------------------
# CI: fast signal on every push and pull request. The release workflow owns
# tags/binaries/npm-publish; this workflow owns "is main healthy".
#
# Jobs: typecheck + full hermetic suite + pack dry-run (validates the files
# list) + server.json sanity (parses, version matches package.json).
# ---------------------------------------------------------------------------

name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun test

      - name: Pack dry-run (validates files list + prepack build)
        run: bun pm pack --dry-run

      - name: npm artifact handshake (the published tarball must run)
        run: |
          bun run build
          test -x dist/cli.js
          test -x dist/index.js
          test -f dist/page.html
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' | timeout 20 bun run dist/index.js > /tmp/mnemyx-handshake.json 2> /tmp/mnemyx-handshake.stderr
          grep -q 'serverInfo' /tmp/mnemyx-handshake.json
          grep -q 'mnemyx' /tmp/mnemyx-handshake.json
          echo "npm handshake OK"

      - name: server.json sanity (parses, version matches package.json)
        run: >-
          bun -e 'const pkg = await Bun.file("package.json").json();
          const srv = await Bun.file("server.json").json();
          if (srv.version !== pkg.version) throw new Error(`server.json version ${srv.version} != package.json ${pkg.version}`);
          const ids = (srv.packages ?? []).map((p) => p.identifier);
          if (!ids.includes(pkg.name)) throw new Error(`server.json packages answer for ${pkg.name}`);
          console.log(`server.json OK (${srv.version}, packages: ${ids.join(", ")})`);'
