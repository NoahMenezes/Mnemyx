# ---------------------------------------------------------------------------
# Release: tag `v*` -> cross-compiled standalone binaries -> GitHub Release.
#
#   git tag v0.1.1 && git push --tags
#
# What it builds (all cross-compiled on ubuntu-latest, no mac runners needed):
#   mnemyx-<os>-<arch>          CLI: init/status/run/export/dashboard/bench
#   mnemyx-server-<os>-<arch>   MCP stdio server (what clients spawn)
# for linux-x64, linux-arm64, darwin-x64, darwin-arm64.
#
# Known binary limitation (verified, not a CI gap): the ONNX `sharp` native
# binding cannot survive `--compile`, so standalone binaries serve keyword
# search with an honest stderr note; semantic embeddings work in the npm
# (Bun) install where node_modules is intact. History, git, sessions,
# dashboard, and all other tools are unaffected.
#
# npm publish runs in the `publish` job on the same tags (keyless OIDC, no
# stored tokens). Human prerequisite, once: `npm login` + first manual
# `npm publish`, then enable Trusted Publisher for this repo in the npm web
# UI. Until then the publish job fails with an auth error and binaries still
# release fine.
# ---------------------------------------------------------------------------

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # upload to the GitHub Release
  id-token: write # keyless provenance (Sigstore)
  attestations: write # attach provenance to the Release assets

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Gate (typecheck + tests)
        run: bun run typecheck && bun test

      - name: Build standalone binaries
        run: bun run build:binaries

      - name: Smoke-test native binary (linux-x64)
        run: |
          set -euo pipefail
          export SMOKE_HOME="$(mktemp -d)"
          ./dist-bin/mnemyx-linux-x64 --version
          HOME="$SMOKE_HOME" ./dist-bin/mnemyx-linux-x64 status
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' >req.txt
          HOME="$SMOKE_HOME" timeout 60 ./dist-bin/mnemyx-server-linux-x64 <req.txt >resp.txt 2>server.log || true
          grep -q '"serverInfo":{"name":"mnemyx"' resp.txt
          HOME="$SMOKE_HOME" ./dist-bin/mnemyx-linux-x64 dashboard --port 4899 --no-open & SRV=$!
          trap 'kill $SRV 2>/dev/null' EXIT
          sleep 2
          curl -sf -o /dev/null "http://127.0.0.1:4899/"
          kill $SRV
          trap - EXIT

      - name: Checksums
        run: |
          cd dist-bin
          sha256sum mnemyx-* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Attest build provenance
        # Attestations require a PUBLIC repo (or GHES with GHAS) — on a
        # user-owned private repo the attest API returns:
        # "Failed to persist attestation: Feature not available for
        #  user-owned private repositories."
        # Gate on visibility + continue-on-error so private-repo releases
        # stay green; provenance lights up automatically when flipped public.
        # v3 also runs on Node 24 (v2 pulled Node 20, now deprecated).
        if: github.event.repository.visibility == 'public'
        continue-on-error: true
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist-bin/mnemyx-*, dist-bin/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-bin/mnemyx-*
            dist-bin/SHA256SUMS.txt
          generate_release_notes: true

  publish:
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless npm auth via Trusted Publisher (OIDC)
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Publish to npm (provenance via OIDC)
        # prepack rebuilds dist/; publishConfig sets public access +
        # provenance, flags repeated here so `npm publish --dry-run`
        # behaves identically.
        run: npm publish --provenance --access public
