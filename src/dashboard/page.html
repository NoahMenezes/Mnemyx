<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mnemyx dashboard (local-only)</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
    --ok: #3fb950; --fail: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 0; padding: 0 16px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 16px 0 8px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 20px; margin: 0; }
  header h1 .x { color: var(--accent); }
  #health { color: var(--dim); font-size: 12px; }
  nav { display: flex; gap: 4px; padding: 12px 0; }
  nav button { background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  nav button.active { border-color: var(--accent); color: var(--accent); }
  section.tab { display: none; }
  section.tab.active { display: block; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; align-items: center; }
  input[type=text], select { background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font: inherit; font-size: 13px; }
  input[type=text].q { flex: 1; min-width: 220px; }
  button.go { background: #1f6feb; color: #fff; border: none; border-radius: 6px; padding: 7px 16px; font: inherit; font-size: 13px; cursor: pointer; }
  label.chk { font-size: 12px; color: var(--dim); display: flex; gap: 4px; align-items: center; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 8px 0; }
  th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
  th { background: var(--panel); color: var(--dim); font-weight: 600; white-space: nowrap; }
  td.num { text-align: right; white-space: nowrap; }
  td.cmd { word-break: break-all; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: #1c2330; }
  .ok { color: var(--ok); } .fail { color: var(--fail); } .unk { color: var(--dim); }
  .tag { font-size: 10px; border: 1px solid var(--warn); color: var(--warn); border-radius: 4px; padding: 0 4px; margin-left: 6px; white-space: nowrap; }
  .note { color: var(--dim); font-size: 12px; margin: 6px 0; }
  .err { color: var(--fail); font-size: 13px; }
  .cards { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; min-width: 140px; }
  .card .v { font-size: 20px; }
  .card .k { font-size: 11px; color: var(--dim); }
  pre.snip { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 12px; white-space: pre-wrap; word-break: break-all; margin: 4px 0 12px; }
  h2 { font-size: 15px; margin: 18px 0 6px; }
  h2 .sub { color: var(--dim); font-weight: 400; font-size: 12px; }
  a.back { color: var(--accent); cursor: pointer; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>mnemyx<span class="x"> dashboard</span></h1>
  <span id="health">connecting…</span>
</header>
<nav>
  <button data-tab="search" class="active">Search</button>
  <button data-tab="sessions">Sessions</button>
  <button data-tab="commits">Commits</button>
  <button data-tab="errors">Errors</button>
  <button data-tab="status">Status</button>
</nav>

<section id="tab-search" class="tab active">
  <div class="bar">
    <input id="q" class="q" type="text" placeholder="docker wont start …" autocomplete="off" spellcheck="false">
    <select id="mode"><option value="auto">auto</option><option value="keyword">keyword</option></select>
    <input id="repo" type="text" placeholder="repo path (optional)" spellcheck="false" style="min-width:200px">
    <label class="chk"><input type="checkbox" id="okonly"> exit 0 only</label>
    <label class="chk"><input type="checkbox" id="onlyrepo"> this repo only</label>
    <button class="go" id="go">Search</button>
  </div>
  <div id="snote" class="note"></div>
  <div id="sres"></div>
</section>

<section id="tab-sessions" class="tab">
  <div class="bar">
    <input id="srepo" type="text" placeholder="repo path (optional)" spellcheck="false" style="min-width:220px">
    <button class="go" id="sgo">List</button>
    <span id="sback" style="display:none"><a class="back" id="backlink">← all sessions</a></span>
  </div>
  <div id="sess"></div>
</section>

<section id="tab-commits" class="tab">
  <div class="bar">
    <input id="cq" class="q" type="text" placeholder="phase 5 …" autocomplete="off" spellcheck="false">
    <button class="go" id="cgo">Search commits</button>
  </div>
  <div id="cres"></div>
</section>

<section id="tab-errors" class="tab">
  <div class="bar">
    <input id="eq" class="q" type="text" placeholder="ValueError: bad …" autocomplete="off" spellcheck="false">
    <button class="go" id="ego">Search errors</button>
  </div>
  <div id="eres"></div>
</section>

<section id="tab-status" class="tab">
  <div id="stcards" class="cards"></div>
  <div id="stdetail" class="note"></div>
</section>

<script>
"use strict";
// All text comes pre-masked from the server, but the DOM is built with
// textContent/escape anyway: history can contain anything.
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmtTs(ts) {
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
}
function badge(exit) {
  if (exit === null || exit === undefined) return '<span class="unk">—</span>';
  return exit === 0 ? '<span class="ok">✅ 0</span>' : `<span class="fail">❌ ${exit}</span>`;
}
function cmdCell(r) {
  const tag = r.redacted ? '<span class="tag">redacted</span>' : '';
  return `<td class="cmd" title="${esc(r.command)}">${esc(r.command)}${tag}</td>`;
}
function cmdTable(rows, startAt) {
  let h = '<table><tr><th>#</th><th>Date</th><th>Shell</th><th>Exit</th><th>Command</th></tr>';
  rows.forEach((r, i) => {
    h += `<tr><td class="num">${startAt + i}</td><td>${fmtTs(r.ts)}${r.approx ? "~" : ""}</td><td>${esc(r.shell)}</td><td>${badge(r.exit)}</td>${cmdCell(r)}</tr>`;
  });
  return h + '</table>';
}
async function getJSON(url) {
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
// Tabs
document.querySelectorAll("nav button").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach((x) => x.classList.remove("active"));
    document.querySelectorAll("section.tab").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    document.getElementById("tab-" + b.dataset.tab).classList.add("active");
    if (b.dataset.tab === "sessions" && !document.getElementById("sess").dataset.loaded) loadSessions();
    if (b.dataset.tab === "status") loadStatus();
  });
});
// Health
getJSON("/api/status").then((s) => {
  document.getElementById("health").textContent =
    `v${s.version} · ${s.commands} cmds · ${s.vectors} vectors · ${s.commits} commits · ${s.repos} repos · hook ${s.hookRcFiles.length ? "on" : "off"}`;
}).catch(() => { document.getElementById("health").textContent = "server unreachable"; });
// Search
async function doSearch() {
  const box = document.getElementById("sres");
  const note = document.getElementById("snote");
  box.innerHTML = '<div class="note">searching…</div>'; note.textContent = "";
  try {
    const p = new URLSearchParams({
      q: document.getElementById("q").value,
      mode: document.getElementById("mode").value,
      limit: "20",
      repo: document.getElementById("repo").value.trim(),
      only_successful: document.getElementById("okonly").checked ? "1" : "",
      only_repo: document.getElementById("onlyrepo").checked ? "1" : "",
    });
    const d = await getJSON("/api/search?" + p.toString());
    if (d.note) note.textContent = d.note;
    box.innerHTML = d.rows.length ? cmdTable(d.rows, 1) : '<div class="note">No matching commands found in shell history.</div>';
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
document.getElementById("go").addEventListener("click", doSearch);
document.getElementById("q").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
// Sessions
async function loadSessions() {
  const box = document.getElementById("sess");
  document.getElementById("sback").style.display = "none";
  box.innerHTML = '<div class="note">loading…</div>';
  try {
    const p = new URLSearchParams({ limit: "15", repo: document.getElementById("srepo").value.trim() });
    const d = await getJSON("/api/sessions?" + p.toString());
    box.dataset.loaded = "1";
    if (!d.sessions.length) { box.innerHTML = '<div class="note">No sessions found in scope.</div>'; return; }
    let h = '<table><tr><th>Session</th><th>When</th><th>Dur</th><th>Repo</th><th>Cmds</th><th>ok/fail/?</th><th>Commits</th><th>Top</th></tr>';
    d.sessions.forEach((s) => {
      const repo = s.repo ? esc(s.repo.split("/").pop()) + (s.mixed ? " (mixed)" : "") : "—";
      const when = fmtTs(s.startTs) + "→" + fmtTs(s.endTs).slice(6);
      const dur = durFmt(s.endTs - s.startTs);
      h += `<tr class="clickable" data-sid="${esc(s.id)}"><td>${esc(s.id)}</td><td>${when}</td><td>${dur}</td><td>${repo}</td><td class="num">${s.commands}</td><td class="num">${s.success}/${s.failed}/${s.unknown}</td><td>${s.commits.length ? esc(s.commits.join(", ")) : "—"}</td><td>${s.top.length ? esc(s.top.join(", ")) : "—"}</td></tr>`;
    });
    box.innerHTML = h + '</table>';
    box.querySelectorAll("tr.clickable").forEach((tr) => {
      tr.addEventListener("click", () => loadSession(tr.dataset.sid));
    });
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function durFmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  if (sec < 60) return sec + "s";
  const m = Math.floor(sec / 60);
  return m < 60 ? m + "m" : Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0") + "m";
}
async function loadSession(id) {
  const box = document.getElementById("sess");
  box.innerHTML = '<div class="note">loading…</div>';
  try {
    const d = await getJSON("/api/session?id=" + encodeURIComponent(id));
    document.getElementById("sback").style.display = "";
    const repo = d.repo ? esc(d.repo) : "unknown (no hook context)";
    let h = `<h2>Session <span class="sub">${esc(d.id)} · ${repo}</span></h2>`;
    h += `<div class="note">${d.commands.length} commands · ${d.success} ok · ${d.failed} failed · ${d.unknown} unknown · ${fmtTs(d.startTs)} → ${fmtTs(d.endTs)} (${durFmt(d.endTs - d.startTs)})</div>`;
    h += '<h2>Commands <span class="sub">oldest first</span></h2>' + (d.commands.length ? cmdTable(d.commands, 1) : '<div class="note">none.</div>');
    if (d.commits.length) {
      h += '<h2>Commits</h2><table><tr><th>Commit</th><th>Date</th><th>Message</th><th>Files</th><th>Repo</th></tr>';
      d.commits.forEach((c) => {
        h += `<tr><td>${esc(c.short)}</td><td>${esc(c.date.slice(0, 10))}</td><td title="${esc(c.message)}">${esc(c.message.slice(0, 100))}</td><td class="num">${c.fileCount}</td><td>${esc((c.repo.split("/").pop()))}</td></tr>`;
      });
      h += '</table>';
    } else { h += '<h2>Commits</h2><div class="note">none in this window.</div>'; }
    box.innerHTML = h;
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
document.getElementById("sgo").addEventListener("click", () => { document.getElementById("sess").dataset.loaded = ""; loadSessions(); });
document.getElementById("backlink").addEventListener("click", loadSessions);
// Commits
async function doCommits() {
  const box = document.getElementById("cres");
  box.innerHTML = '<div class="note">searching…</div>';
  try {
    const d = await getJSON("/api/commits?" + new URLSearchParams({ q: document.getElementById("cq").value, limit: "20" }).toString());
    if (!d.commits.length) { box.innerHTML = '<div class="note">No matching commits found in indexed repos.</div>'; return; }
    let h = '<table><tr><th>Commit</th><th>Date</th><th>Message</th><th>Files</th><th>Repo</th></tr>';
    d.commits.forEach((c) => {
      const files = c.fileCount ? `${c.fileCount} · ${esc((c.files[0] || "").split("/").pop())}` : "—";
      h += `<tr><td>${esc(c.short)}</td><td>${esc(c.date.slice(0, 10))}</td><td title="${esc(c.message)}">${esc(c.message.slice(0, 100))}</td><td>${files}</td><td>${esc(c.repo.split("/").pop())}</td></tr>`;
    });
    box.innerHTML = h + '</table>';
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
document.getElementById("cgo").addEventListener("click", doCommits);
document.getElementById("cq").addEventListener("keydown", (e) => { if (e.key === "Enter") doCommits(); });
// Errors
async function doErrors() {
  const box = document.getElementById("eres");
  box.innerHTML = '<div class="note">searching…</div>';
  try {
    const d = await getJSON("/api/error?" + new URLSearchParams({ q: document.getElementById("eq").value, limit: "10" }).toString());
    if (!d.rows.length) { box.innerHTML = '<div class="note">No past errors match that message.</div>'; return; }
    let h = '<table><tr><th>#</th><th>Date</th><th>Exit</th><th>Command</th></tr>';
    d.rows.forEach((r, i) => {
      h += `<tr><td class="num">${i + 1}</td><td>${fmtTs(r.ts)}</td><td>${badge(r.exit)}</td><td class="cmd" title="${esc(r.command)}">${esc(r.command)}</td></tr>`;
    });
    h += '</table>';
    d.rows.forEach((r, i) => { h += `<h2>Error ${i + 1}</h2><pre class="snip">${esc(r.snippet)}</pre>`; });
    box.innerHTML = h;
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
document.getElementById("ego").addEventListener("click", doErrors);
document.getElementById("eq").addEventListener("keydown", (e) => { if (e.key === "Enter") doErrors(); });
// Status
async function loadStatus() {
  try {
    const s = await getJSON("/api/status");
    const cards = [
      [s.commands, "commands"], [s.vectors, "vectors"], [s.commits, "commits"],
      [s.repos, "repos"], [s.exitLogLines, "exit-log lines"],
    ];
    document.getElementById("stcards").innerHTML = cards.map(([v, k]) => `<div class="card"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");
    document.getElementById("stdetail").textContent =
      `db: ${s.dbPath} · config: ${s.configPath} · hook: ${s.hookRcFiles.length ? s.hookRcFiles.join(", ") : "not installed"} · model: ${s.modelId}`;
  } catch (e) { document.getElementById("stdetail").textContent = String(e.message || e); }
}
loadStatus();
</script>
</body>
</html>
